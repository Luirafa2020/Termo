<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>TERMO</h1>

        <div id="loading-message" style="display: none; color: var(--cell-text-color); font-size: 1.2rem;">
            Carregando palavras...
        </div>

        <div id="game-board" style="display: none;">
            <!-- As linhas e células serão geradas pelo JavaScript (Agora 6 linhas) -->
        </div>

        <div id="message-area">
            <!-- Mensagens para o usuário -->
        </div>

        <button id="reset-button" style="display: none;">Jogar Novamente</button>

        <div id="keyboard" style="display: none;">
           <!-- Teclas serão geradas pelo JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
